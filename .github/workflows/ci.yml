name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "pytest<8.0.0" pytest-json-report pytest-metadata requests flask
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pytest & Generate Report
      env:
        PYTHONPATH: .
      run: |
        python -m pytest -v --json-report --json-report-file=test-report.json

    - name: Send Test Results to Receiver
      if: always()
      env:
        RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
      run: |
        CLEAN_URL=$(echo "$RECEIVER_URL" | tr -d '"' | tr -d "'" | xargs)
        if [ -n "$CLEAN_URL" ] && [ -f test-report.json ]; then
          curl -X POST -H "Content-Type: application/json" -d @test-report.json "$CLEAN_URL" || true
        fi